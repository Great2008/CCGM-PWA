name: Sync Content

# Manually triggered from the Actions tab (works from GitHub's mobile
# app/web UI — no terminal needed). Run this any time reading content
# (Sermons, Sabbath School, Devotional, Blog, Gallery, Newsletter) has
# changed and you want the mobile app's bundled snapshot refreshed. The
# mobile app polls for this once a day on its own — this just controls
# *what* it'll find the next time it checks.
on:
  workflow_dispatch:

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Export content to JSON
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/export-content.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/sermons.json public/data/sabbath-lessons.json public/data/devotionals.json public/data/blog.json public/data/gallery.json public/data/newsletters.json public/data/manifest.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: sync content snapshot"
          git push
